<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 伴读 · 阅读教练</title>
<script src="mermaid.min.js"></script>
<style>
:root {
  --bg: #FDFBF7;
  --card: #FFFFFF;
  --text: #2C2C2C;
  --text-muted: #8B8682;
  --text-light: #B0AAA4;
  --accent: #B8543A;
  --accent-hover: #9A3F2A;
  --accent-soft: rgba(184,84,58,0.08);
  --accent-soft-hover: rgba(184,84,58,0.14);
  --border: #E8E4DD;
  --border-light: #F0ECE5;
  --success: #5B8C5A;
  --warning: #D4A853;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --font-display: "Georgia","Noto Serif SC","Source Han Serif SC",serif;
  --font-ui: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono: "SF Mono","Cascadia Code","JetBrains Mono",monospace;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.app-container {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

/* Header */
.app-header {
  text-align: center;
  margin-bottom: 32px;
}
.app-header h1 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.02em;
}
.app-header .subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}
.settings-btn {
  position: absolute;
  top: 20px;
  right: 24px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 16px;
  cursor: pointer;
  font-family: var(--font-ui);
  transition: all var(--transition);
}
.settings-btn:hover { border-color: var(--accent); color: var(--accent); }
.settings-btn.configured { border-color: var(--success); color: var(--success); }

/* Highlight source tabs */
.source-tabs {
  display: inline-flex;
  gap: 6px;
  margin-left: 8px;
  vertical-align: middle;
}
.source-tab {
  font-size: 12px;
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--text-muted);
  cursor: pointer;
  font-family: var(--font-ui);
  transition: all var(--transition);
}
.source-tab:hover { border-color: var(--accent); color: var(--accent); }
.source-tab.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.hl-section-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.hl-section-head .section-label { margin-bottom: 0; }
.hl-source-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
  line-height: 1.6;
}
.hl-type-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-right: 6px;
  vertical-align: 1px;
  font-family: var(--font-ui);
}
.hl-type-badge.hot { background: rgba(184,84,58,.1); color: var(--accent); }
.hl-type-badge.mine { background: rgba(91,140,90,.12); color: var(--success); }
.hl-link {
  color: var(--accent);
  font-size: 11px;
  text-decoration: none;
  margin-left: 10px;
  opacity: .85;
}
.hl-link:hover { opacity: 1; text-decoration: underline; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
}

/* Search Mode */
.search-input-wrap {
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-input-wrap input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--bg);
  transition: all var(--transition);
}
.search-input-wrap input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-input-wrap input::placeholder { color: var(--text-light); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 14px;
  font-family: var(--font-ui);
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--accent-soft); color: var(--accent); }
.btn-secondary:hover:not(:disabled) { background: var(--accent-soft-hover); }
.btn-outline {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Search Results */
.search-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-muted);
}
.search-meta .book-cover {
  width: 40px;
  height: 54px;
  border-radius: 4px;
  object-fit: cover;
  box-shadow: var(--shadow-sm);
}
.search-meta .book-info h4 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.search-hint {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  line-height: 1.6;
}

.highlight-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 500px;
  overflow-y: auto;
}
.highlight-card {
  padding: 14px 16px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
}
.highlight-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.highlight-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.highlight-card .hl-text {
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.highlight-card .hl-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-light);
}
.highlight-card .hl-count {
  color: var(--accent);
  font-weight: 500;
}
.highlight-card .hl-chapter {
  color: var(--text-muted);
}
.highlight-card .select-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: transparent;
  transition: all var(--transition);
  background: var(--bg);
}
.highlight-card.selected .select-badge {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* Selected Passage */
.selected-passage {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px 18px;
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.9;
  color: var(--text);
  margin-bottom: 16px;
  position: relative;
}
.selected-passage .passage-label {
  font-size: 11px;
  font-family: var(--font-ui);
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.selected-passage .clear-passage {
  position: absolute;
  top: 8px;
  right: 10px;
  background: none;
  border: none;
  color: var(--text-light);
  cursor: pointer;
  font-size: 16px;
  padding: 2px 6px;
}

/* Paste Mode */
.textarea-wrap {
  position: relative;
}
.textarea-wrap textarea {
  width: 100%;
  min-height: 200px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.8;
  font-family: var(--font-ui);
  color: var(--text);
  background: var(--bg);
  resize: vertical;
  transition: all var(--transition);
}
.textarea-wrap textarea::placeholder { color: var(--text-light); }
.textarea-wrap textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* Action Buttons */
.action-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.action-row .btn { flex: 1; justify-content: center; min-width: 140px; }

/* Result Area */
.result-area { margin-top: 24px; }

/* Section labels & dividers (in results card) */
.section-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.section-divider {
  height: 1px;
  background: var(--border-light);
  margin: 24px 0;
}
.mindmap-section { margin-top: 8px; }

/* Mindmap toolbar */
.mindmap-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.mindmap-toolbar .toolbar-spacer { flex: 1; }
.mindmap-toolbar .tb-btn {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.mindmap-toolbar .tb-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.mindmap-toolbar .tb-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.mindmap-edit-area {
  width: 100%;
  min-height: 300px;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.6;
  padding: 14px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  background: var(--bg-alt);
  color: var(--text);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
.mindmap-edit-area:focus {
  border-color: var(--accent);
}

/* Mindmap & Graph */
.mindmap-result {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 20px;
  overflow-x: auto;
  min-height: 400px;
}
.mindmap-result .mermaid-wrapper {
  min-width: 900px;
  padding: 12px 0;
  display: flex;
  justify-content: center;
}
.mindmap-result .mermaid {
  display: inline-block;
}
.mindmap-result .mermaid svg {
  max-width: none !important;
  min-height: 400px;
  height: auto !important;
}

/* Conversation */
.qa-container {
  background: var(--card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.qa-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-light);
  font-size: 13px;
  color: var(--text-muted);
}
.qa-header span { color: var(--accent); font-weight: 600; }
.qa-messages {
  max-height: 450px;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  display: flex;
  gap: 10px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.ai { align-self: flex-start; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.message.ai .avatar { background: var(--accent-soft); }
.message.user .avatar { background: #F0ECE5; }
.bubble {
  max-width: 85%; padding: 12px 16px;
  border-radius: var(--radius); font-size: 14px; line-height: 1.7;
}
.message.ai .bubble { background: var(--bg); border: 1px solid var(--border-light); }
.message.user .bubble { background: var(--accent-soft); }
.qa-input-row {
  padding: 12px 20px; border-top: 1px solid var(--border-light);
  display: flex; gap: 8px;
}
.qa-input-row textarea {
  flex: 1; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-family: var(--font-ui); resize: none;
  min-height: 40px; max-height: 100px;
  background: var(--bg); color: var(--text);
}
.qa-input-row textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qa-input-row .send-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all var(--transition);
}
.qa-input-row .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
.qa-input-row .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Loading */
.loading-row {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 0; color: var(--text-muted); font-size: 13px;
}
.loading-dots { display: flex; gap: 3px; }
.loading-dots span {
  width: 5px; height: 5px; background: var(--accent);
  border-radius: 50%; animation: bounce 1.4s infinite ease-in-out;
}
.loading-dots span:nth-child(1) { animation-delay: 0s; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-5px); opacity: 1; }
}

/* Error / Status */
.status-msg {
  padding: 12px 16px; border-radius: var(--radius);
  font-size: 13px; line-height: 1.6;
}
.status-msg.info { background: #F0F7FF; color: #3B6CB4; }
.status-msg.error { background: #FFF0F0; color: #B8543A; }
.status-msg.success { background: #F0F7F0; color: #386B38; }
.status-msg.warning { background: #FFF8F0; color: #8B6B38; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.2); backdrop-filter: blur(3px);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 28px;
  max-width: 420px; width: 90%;
}
.modal h3 { font-family: var(--font-display); font-size: 17px; font-weight: 400; margin-bottom: 4px; }
.modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; margin-top: 12px; }
.modal select, .modal input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font-ui); color: var(--text);
  background: var(--bg); transition: border var(--transition);
}
.modal select:focus, .modal input:focus { outline: none; border-color: var(--accent); }
.modal input.api-key { font-family: var(--font-mono); font-size: 13px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

/* Toast */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 13px; z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

/* Server status badge */
.server-status {
  font-size: 11px;
  color: var(--text-light);
  text-align: center;
  margin-top: 8px;
}
.server-status .dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; margin-right: 4px;
}
.server-status .dot.online { background: var(--success); }
.server-status .dot.offline { background: #CCC; }

.hidden { display: none !important; }

@media (max-width: 500px) {
  .app-container { padding: 24px 16px 60px; }
  .action-row { flex-direction: column; }
  .search-input-wrap { flex-direction: column; }
}
</style>
</head>
<body>

<div class="app-container">

  <!-- Header -->
  <div class="app-header">
    <h1>AI 伴读</h1>
    <p class="subtitle">你的苏格拉底式阅读教练</p>
    <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">⚙️ 设置</button>
  </div>

  <!-- Mode Tabs -->

  <!-- ====== SEARCH MODE ====== -->
  <div id="searchMode">
    <!-- Step 1: Search -->
    <div class="card" id="searchStep">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="输入书名，比如「关键跃升」「三体」…" onkeydown="if(event.key==='Enter')searchBook()">
        <button class="btn btn-primary" onclick="searchBook()">🔍 搜索</button>
      </div>
      <div id="searchStatus"></div>
    </div>

    <!-- Step 2: Results -->
    <div class="card hidden" id="resultsStep">
      <!-- Book meta -->
      <div class="search-meta" id="searchMeta"></div>

      <!-- Mindmap section (top, auto-generated) -->
      <div id="mindmapSection" class="mindmap-section">
        <div class="section-label">📚 全书结构</div>
        <div id="mindmapContent"></div>
      </div>

      <!-- Divider -->
      <div class="section-divider"></div>

      <!-- Highlights section (appendix) -->
      <div class="hl-section-head">
        <div class="section-label">📝 划线 · 勾选后可开始对话</div>
        <div class="source-tabs" id="hlSourceTabs">
          <button class="source-tab active" data-src="hot" onclick="switchHighlightSource('hot')">🔥 万人划线</button>
          <button class="source-tab" data-src="mine" onclick="switchHighlightSource('mine')">👤 我的划线</button>
        </div>
      </div>
      <div class="hl-source-hint" id="hlSourceHint"></div>
      <div class="highlight-list" id="highlightList"></div>
      <div class="action-row" style="margin-top:16px">
        <button class="btn btn-secondary" id="btnChatSearch" disabled onclick="startChat()">
          💬 开始对话<span id="chatHighlightCount" style="font-size:11px;opacity:0.7;margin-left:4px"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ====== RESULT AREA ====== -->
  <div id="resultArea" class="result-area hidden">
    <div class="selected-passage hidden" id="selectedPassage">
      <span class="passage-label">📖 当前选段</span>
      <button class="clear-passage" onclick="clearSelection()" title="清除">×</button>
      <div id="passageText"></div>
    </div>
    <div id="resultContent"></div>
  </div>

  <div class="server-status">
    <span class="dot offline" id="serverDot"></span>
    <span id="serverMsg">检查服务状态…</span>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ API 设置</h3>
    <p>配置大模型 API，用于生成思维导图和引导提问。</p>
    <p style="font-size:11px;color:var(--text-light);background:rgba(255,193,7,.08);padding:8px 10px;border-radius:8px;line-height:1.6">
      🔒 隐私提示：Key 仅保存在本浏览器 localStorage，不会上传到任何服务器；对话时你勾选的划线原文会发送给你选择的模型供应商（智谱 / DeepSeek）。点击「清除已保存的 Key」可随时删除。
    </p>

    <label>模型供应商</label>
    <select id="modelProvider" onchange="onProviderChange()">
      <option value="zhipu">智谱 GLM（推荐）</option>
      <option value="deepseek">DeepSeek</option>
    </select>

    <label id="apiKeyLabel">智谱 API Key</label>
    <input type="password" id="apiKeyInput" placeholder="粘贴你的 API Key" class="api-key">
    <p style="font-size:11px;color:var(--text-light);margin-top:4px">
      获取地址：<a id="keyUrlLink" href="https://open.bigmodel.cn/usercenter/apikeys" target="_blank" style="color:var(--accent)">open.bigmodel.cn</a>
    </p>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="clearSettings()">清除已保存的 Key</button>
      <button class="btn btn-outline" onclick="toggleSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
const PROVIDERS = {
  zhipu: {
    name: '智谱 GLM',
    endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
    model: 'glm-4-flash',
    keyUrl: 'https://open.bigmodel.cn/usercenter/apikeys',
  },
  deepseek: {
    name: 'DeepSeek',
    endpoint: 'https://api.deepseek.com/v1/chat/completions',
    model: 'deepseek-chat',
    keyUrl: 'https://platform.deepseek.com/api_keys',
  },
};

const SESSION_KEY = 'socrates_session_v1';

// 统一的状态容器：当前书、划线、选中项、对话均收敛于此
let state = {
  provider: localStorage.getItem('ai_provider') || 'zhipu',
  apiKey: '',
  apiKeyZhipu: localStorage.getItem('ai_key_zhipu') || '',
  apiKeyDeepseek: localStorage.getItem('ai_key_deepseek') || '',
  // 当前书（含搜索结果的完整 meta，用于导出与 deep link）
  currentBook: null,          // { bookId, title, author, cover, rating, intro, chapters }
  // 划线列表（统一结构，渲染与选中共用）
  highlightSource: 'hot',     // 'hot' = 万人划线 | 'mine' = 我的划线
  highlights: [],             // [{ text, chapter, chapterUid, meta, kind, link }]
  // 选中项（带出处元数据，供导出与对话）
  selectedItems: [],          // [{ text, chapter, meta }]
  selectedText: '',
  conversationHistory: [],
  questionRound: 0,
  isProcessing: false,
  chatSummary: '',            // 「生成读书小结」产物
  lastMermaidCode: '',
  mindmapBookTitle: '',
  // 加载状态标记
  mineLoaded: false,
  mineLoading: false,
};

// Init
state.apiKey = state.provider === 'zhipu' ? state.apiKeyZhipu : state.apiKeyDeepseek;
document.getElementById('modelProvider').value = state.provider;
document.getElementById('apiKeyInput').value = state.apiKey;
updateSettingsUI();
checkServer();
restoreSession();

// ============ SERVER CHECK ============
async function checkServer() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    const dot = document.getElementById('serverDot');
    const msg = document.getElementById('serverMsg');
    if (d.ok && d.weread) {
      dot.className = 'dot online';
      msg.textContent = d.skillVersion ? `微信读书服务已连接 · v${d.skillVersion}` : '微信读书服务已连接';
    } else if (d.ok) {
      dot.className = 'dot offline';
      msg.textContent = '微信读书 API 未配置';
    }
  } catch(e) {
    document.getElementById('serverDot').className = 'dot offline';
    document.getElementById('serverMsg').innerHTML = 'Preview 面板不支持访问本地服务，请在浏览器中打开 <a href="http://localhost:3456" target="_blank" style="color:var(--accent)">http://localhost:3456</a>';
  }
}

// ============ BOOK SEARCH ============
async function searchBook() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) return;
  hideSessionPrompt();

  const status = document.getElementById('searchStatus');
  status.innerHTML = '<div class="loading-row"><div class="loading-dots"><span></span><span></span><span></span></div>正在搜索「' + escapeHtml(keyword) + '」…</div>';

  try {
    // Search
    const sr = await wereadCall('/store/search', { keyword, count: 3 });
    if (sr.errcode) throw new Error(sr.errmsg || '搜索失败');

    const books = (sr.results || []).flatMap(g => g.books || []);
    if (!books.length) {
      status.innerHTML = '<div class="status-msg warning">未找到「' + escapeHtml(keyword) + '」，试试其他书名</div>';
      return;
    }

    const book = books[0].bookInfo;
    clearSession();
    state.currentBook = {
      bookId: book.bookId,
      title: book.title,
      author: book.author,
      cover: book.cover || '',
      rating: (book.newRating / 10).toFixed(1),
      ratingCount: book.newRatingCount || 0,
    };
    state.highlightSource = 'hot';
    state.mineLoaded = false;
    state.mineLoading = false;
    state.lastMermaidCode = '';
    state.mindmapBookTitle = '';
    document.querySelectorAll('#hlSourceTabs .source-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.src === 'hot');
    });
    document.getElementById('searchStep').classList.add('hidden');
    document.getElementById('resultsStep').classList.remove('hidden');

    // Show book meta + deep link
    document.getElementById('searchMeta').innerHTML = `
      <img class="book-cover" src="${escapeHtml(book.cover || '')}" alt="封面" onerror="this.style.display='none'">
      <div class="book-info">
        <h4>${escapeHtml(book.title)}</h4>
        <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(book.author || '')} · 评分 ${(book.newRating/10).toFixed(1)} · ${book.newRatingCount}人评价</div>
        <div style="font-size:11px;margin-top:4px"><a class="hl-link" href="weread://reading?bId=${encodeURIComponent(book.bookId)}" style="margin-left:0">📖 在微信读书打开本书</a></div>
      </div>
    `;

    // Get highlights + book info + chapters with failure isolation
    document.getElementById('mindmapContent').innerHTML = '<div class="loading-row"><div class="loading-dots"><span></span><span></span><span></span></div>正在获取书籍详情…</div>';
    document.getElementById('highlightList').innerHTML = '<div class="loading-row"><div class="loading-dots"><span></span><span></span><span></span></div>正在获取热门划线…</div>';

    // 失败隔离：每个请求独立捕获，互不拖累
    const [hr, bi, ci] = await Promise.all([
      wereadCall('/book/bestbookmarks', { bookId: book.bookId, chapterUid: 0, synckey: 0 }).catch(err => ({ _err: err, errcode: -1 })),
      wereadCall('/book/info', { bookId: book.bookId }).catch(err => ({ _err: err, errcode: -1 })),
      wereadCall('/book/chapterinfo', { bookId: book.bookId }).catch(err => ({ _err: err, errcode: -1 })),
    ]);

    // 各自消化：intro/chapters 失败仅影响导图精度；热门划线失败单独提示
    if (bi && !bi.errcode && bi.intro) state.currentBook.intro = bi.intro || '';
    if (ci && !ci.errcode && ci.chapters) {
      state.currentBook.chapters = (ci.chapters || []).map(c => ({ title: c.title, level: c.level || 1, chapterIdx: c.chapterIdx }));
    }
    const introReady = !!(state.currentBook.intro);
    const chaptersReady = !!(state.currentBook.chapters && state.currentBook.chapters.length);

    if (hr && !hr.errcode) {
      renderHotHighlights(hr.items || [], hr.chapters || []);
    } else {
      const why = hr && hr._err ? '（网络异常）' : (hr && hr.errmsg ? '：' + hr.errmsg : '');
      document.getElementById('highlightList').innerHTML = '<div class="status-msg warning">热门划线获取失败' + escapeHtml(why || '') + '。可切换「👤 我的划线」或直接生成导图。</div>';
      document.getElementById('btnChatSearch').disabled = true;
    }

    if (introReady || chaptersReady) {
      startBookMindmap();
    } else {
      const warn = document.createElement('div');
      warn.className = 'status-msg warning';
      warn.textContent = '书籍详情/章节目录获取失败，无法生成全书导图。若你的 API Key 正常，请稍后重新搜索，或先阅读「我的划线」。';
      document.getElementById('mindmapContent').innerHTML = '';
      document.getElementById('mindmapContent').appendChild(warn);
    }
  } catch(e) {
    let msg = e.message;
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('网络')) {
      msg = '无法连接到本地服务。请在浏览器中打开 http://localhost:3456 使用此功能（Preview 面板不支持），并确认已运行 bash scripts/start.sh。';
    }
    const errHtml = '<div class="status-msg error">' + escapeHtml(msg) + '</div>';
    if (document.getElementById('resultsStep').classList.contains('hidden')) {
      status.innerHTML = errHtml;
    } else {
      document.getElementById('mindmapContent').innerHTML = errHtml;
      document.getElementById('highlightList').innerHTML = '';
    }
  }
}

// 划线来源切换：hot / mine
async function switchHighlightSource(src) {
  if (!state.currentBook) return;
  state.highlightSource = src;
  document.querySelectorAll('#hlSourceTabs .source-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.src === src);
  });
  const hint = document.getElementById('hlSourceHint');

  if (src === 'mine') {
    if (!state.mineLoaded && !state.mineLoading) {
      await loadMyHighlights();
    }
    if (state.mineLoaded) {
      hint.textContent = '展示你在微信读书里的划线（最多 200 条）与带原文的想法，按最近时间排序。勾选后同样可开启引导对话。';
    }
  } else {
    hint.textContent = '该书被划线最多的段落，按热度排序，前 20 条。';
  }
}

// 拉取「我的划线」：/book/bookmarklist + /review/list/mine，串行 + 冷却防限流
async function loadMyHighlights() {
  const book = state.currentBook;
  const list = document.getElementById('highlightList');
  state.mineLoading = true;
  list.innerHTML = '<div class="loading-row"><div class="loading-dots"><span></span><span></span><span></span></div>正在获取你的划线…</div>';
  document.getElementById('btnChatSearch').disabled = true;

  try {
    // 串行请求 + 冷却，避免官方瞬时限流(429)
    const bm = await wereadCall('/book/bookmarklist', { bookId: book.bookId }).catch(err => ({ _err: err, errcode: -1 }));
    await sleep(400);
    const rv = await wereadCall('/review/list/mine', { bookid: book.bookId, count: 50, synckey: 0 }).catch(err => ({ _err: err, errcode: -1 }));

    const items = [];
    const seen = new Set();

    // 划线：最多取 200 条（该接口不支持分页，整包返回）
    if (bm && !bm.errcode && bm.updated) {
      const chMap = {};
      (bm.chapters || []).forEach(c => { chMap[c.chapterUid] = c.title; });
      (bm.updated || []).forEach(u => {
        if (u.type === 1 && u.markText && !seen.has(u.markText)) {
          seen.add(u.markText);
          const d = u.createTime ? new Date(u.createTime * 1000).toLocaleDateString('zh-CN') : '';
          items.push({
            text: u.markText,
            chapter: chMap[u.chapterUid] || '',
            chapterUid: u.chapterUid,
            kind: 'mine',
            meta: '📌 划线' + (d ? ' · ' + d : ''),
          });
        }
      });
    }

    // 想法/点评（带原文 abstract 的合并展示）
    if (rv && !rv.errcode && rv.reviews) {
      rv.reviews.forEach(r => {
        const rev = r.review || {};
        const abs = rev.abstract || '';
        const content = (rev.content || '').trim();
        if (abs && content && !seen.has(abs)) {
          seen.add(abs);
          const d = rev.createTime ? new Date(rev.createTime * 1000).toLocaleDateString('zh-CN') : '';
          items.push({
            text: abs,
            thought: content,
            chapter: rev.chapterName || '',
            chapterUid: rev.chapterUid,
            kind: 'mine',
            meta: '💭 我的想法' + (d ? ' · ' + d : ''),
          });
        }
      });
    }

    if (!items.length) {
      const whyHot = (bm && bm._err) || (rv && rv._err) ? '' : '这本书还没有你的划线或想法。';
      const hintMsg = (bm && bm.errcode && bm.errmsg ? '划线获取失败：' + bm.errmsg + '。' : '') +
        (rv && rv.errcode && rv.errmsg ? '想法获取失败：' + rv.errmsg + '。' : '') + whyHot;
      list.innerHTML = '<div class="status-msg info">' + escapeHtml(hintMsg || '暂无个人划线') + '</div>';
      state.mineLoaded = true;
      state.highlights = [];
      window._selectedIdxs = new Set();
      return;
    }

    items.sort((a, b) => 0); // 保持划线在前
    state.highlights = items;
    window._selectedIdxs = new Set();
    state.mineLoaded = true;
    renderHighlightList();
  } catch(e) {
    list.innerHTML = '<div class="status-msg error">获取个人划线失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    state.mineLoading = false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============ HIGHLIGHTS RENDERING ============
function renderHotHighlights(items, chapters) {
  const chapterMap = {};
  (chapters || []).forEach(c => { chapterMap[c.chapterUid] = c.title; });
  state.highlights = (items || [])
    .filter(item => item.markText)
    .map(item => ({
      text: item.markText,
      chapter: chapterMap[item.chapterUid] || '',
      chapterUid: item.chapterUid,
      kind: 'hot',
      meta: '🔥 ' + (item.totalCount || 0).toLocaleString() + ' 人划线',
      link: buildBestBookmarkLink(item),
    }));
  window._selectedIdxs = new Set();
  document.getElementById('hlSourceHint').textContent = '该书被划线最多的段落，按热度排序，前 20 条。';
  renderHighlightList();
}

// deep link：跳转划线所在位置（bestbookmark），缺少 userVid 则降级为章节
function buildBestBookmarkLink(item) {
  try {
    if (!item || !item.chapterUid) return '';
    const base = 'weread://bestbookmark?bookId=' + encodeURIComponent(state.currentBook.bookId) +
      '&chapterUid=' + encodeURIComponent(item.chapterUid) +
      '&userVid=' + encodeURIComponent(item.userVid || '');
    if (item.range) {
      const parts = String(item.range).split('-');
      return base + '&rangeStart=' + encodeURIComponent(parts[0] || '') + '&rangeEnd=' + encodeURIComponent(parts[1] || parts[0] || '');
    }
    return 'weread://reading?bId=' + encodeURIComponent(state.currentBook.bookId) + '&chapterUid=' + encodeURIComponent(item.chapterUid);
  } catch(e) { return ''; }
}

function renderHighlightList() {
  const list = document.getElementById('highlightList');
  list.innerHTML = state.highlights.map((item, i) => {
    const chapter = item.chapter;
    const badgeCls = item.kind === 'hot' ? 'hot' : 'mine';
    const badgeTxt = item.kind === 'hot' ? '万人' : '我的';
    const linkHtml = item.link
      ? `<a class="hl-link" href="${item.link}" onclick="event.stopPropagation()" title="在微信读书打开该划线">📖 跳转</a>`
      : '';
    return `
      <div class="highlight-card" data-idx="${i}" onclick="toggleHighlight(${i}, event)">
        <div class="select-badge">✓</div>
        <div class="hl-text">${escapeHtml(item.text)}</div>
        ${item.thought ? `<div class="hl-meta" style="margin-top:6px"><span style="color:var(--success)">💭 ${escapeHtml(String(item.thought).slice(0, 120))}${item.thought.length > 120 ? '…' : ''}</span></div>` : ''}
        <div class="hl-meta">
          <span><span class="hl-type-badge ${badgeCls}">${badgeTxt}</span><span class="hl-count">${escapeHtml(item.meta || '')}</span></span>
          <span class="hl-chapter">${chapter ? escapeHtml(chapter) : ''}${linkHtml}</span>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('btnChatSearch').disabled = !window._selectedIdxs || window._selectedIdxs.size === 0;
  document.getElementById('chatHighlightCount').textContent = '';
}

function toggleHighlight(idx, event) {
  if (event && event.target && event.target.closest('a')) return; // 不拦截 deep link
  const card = document.querySelector(`.highlight-card[data-idx="${idx}"]`);
  if (!card) return;

  if (card.classList.contains('selected')) {
    card.classList.remove('selected');
    window._selectedIdxs.delete(idx);
  } else {
    card.classList.add('selected');
    window._selectedIdxs.add(idx);
  }

  const count = window._selectedIdxs.size;
  const btn = document.getElementById('btnChatSearch');
  const counter = document.getElementById('chatHighlightCount');
  btn.disabled = count === 0;
  counter.textContent = count > 0 ? `（已选 ${count} 条）` : '';

  if (count > 0) {
    // 记录带出处的选中项，供导出/对话使用
    state.selectedItems = Array.from(window._selectedIdxs).sort((a,b)=>a-b)
      .map(i => {
        const h = state.highlights[i];
        return { text: h.text, chapter: h.chapter || '', meta: h.meta || '' };
      });
    state.selectedText = state.selectedItems.map(it => it.text).join('\n\n---\n\n');
  } else {
    state.selectedItems = [];
    state.selectedText = '';
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('selectedPassage').classList.add('hidden');
    document.getElementById('resultContent').innerHTML = '';
  }
  state.conversationHistory = [];
  state.questionRound = 0;
  state.chatSummary = '';
  clearSession();
}

// ============ WEREAD PROXY ============
async function wereadCall(apiName, params) {
  const resp = await fetch('/api/weread', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ api_name: apiName, ...params }),
  });
  if (!resp.ok) {
    let msg = 'HTTP ' + resp.status;
    try { const j = await resp.json(); msg = j.errmsg || msg; } catch(e) {}
    throw new Error(msg);
  }
  return resp.json();
}

// ============ ACTIONS ============
function getCurrentText() {
  return state.selectedText || '';
}

function clearSelection() {
  state.selectedText = '';
  state.conversationHistory = [];
  state.questionRound = 0;
  state.chatSummary = '';
  state.selectedItems = [];
  window._selectedIdxs = new Set();
  clearSession();
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('selectedPassage').classList.add('hidden');
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('mindmapContent').innerHTML = '';
  document.getElementById('highlightList').innerHTML = '';
  document.getElementById('hlSourceHint').textContent = '';

  document.getElementById('searchStep').classList.remove('hidden');
  document.getElementById('resultsStep').classList.add('hidden');
  document.getElementById('searchStatus').innerHTML = '';
}

// ---------- 会话持久化（刷新后恢复未完成的引导对话） ----------
function saveSession() {
  if (!state.currentBook || !state.conversationHistory.length) return;
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      book: state.currentBook,
      selectedItems: state.selectedItems,
      selectedText: state.selectedText,
      history: state.conversationHistory,
      round: state.questionRound,
      summary: state.chatSummary,
      source: state.highlightSource,
    }));
  } catch(e) { /* storage full or blocked */ }
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
}

function restoreSession() {
  let s;
  try { s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return; }
  if (!s || !s.book || !s.history || !s.history.length) return;

  // 提示用户存在未完成会话，由用户决定是否继续
  const banner = document.createElement('div');
  banner.className = 'status-msg info';
  banner.id = 'sessionBanner';
  banner.style.marginBottom = '12px';
  banner.innerHTML = `检测到《${escapeHtml(s.book.title)}》有一场未完成的引导对话（第 ${s.round}/5 轮）。`;
  const btnResume = document.createElement('button');
  btnResume.className = 'btn btn-secondary';
  btnResume.style.marginRight = '8px';
  btnResume.textContent = '继续对话';
  btnResume.onclick = () => resumeSession(s);
  const btnDiscard = document.createElement('button');
  btnDiscard.className = 'btn btn-outline';
  btnDiscard.textContent = '放弃并开始新的';
  btnDiscard.onclick = () => { hideSessionPrompt(); clearSession(); };
  banner.appendChild(btnResume);
  banner.appendChild(btnDiscard);

  const searchStep = document.getElementById('searchStep');
  searchStep.parentNode.insertBefore(banner, searchStep);
  window._pendingSession = s;
}

function hideSessionPrompt() {
  const b = document.getElementById('sessionBanner');
  if (b) b.remove();
  window._pendingSession = null;
}

function resumeSession(s) {
  hideSessionPrompt();
  clearSelection();               // 重置 DOM 后重建
  state.currentBook = s.book;
  state.selectedItems = s.selectedItems || [];
  state.selectedText = s.selectedText || '';
  state.conversationHistory = s.history || [];
  state.questionRound = s.round || 0;
  state.chatSummary = s.summary || '';
  state.highlightSource = s.source || 'hot';
  window._selectedIdxs = new Set();

  document.getElementById('searchStep').classList.add('hidden');
  document.getElementById('resultsStep').classList.remove('hidden');
  const book = state.currentBook;
  document.getElementById('searchMeta').innerHTML = `
    <img class="book-cover" src="${escapeHtml(book.cover || '')}" alt="封面" onerror="this.style.display='none'">
    <div class="book-info">
      <h4>${escapeHtml(book.title)}</h4>
      <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(book.author || '')} · 已恢复上次会话</div>
    </div>
  `;
  document.querySelectorAll('#hlSourceTabs .source-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.src === state.highlightSource);
  });
  document.getElementById('hlSourceHint').textContent = '已恢复会话：勾选的划线内容仍保留，可直接继续对话。';
  document.getElementById('highlightList').innerHTML = '';
  document.getElementById('mindmapContent').innerHTML = '<div class="status-msg info">已恢复上次会话，未重新生成全书导图。如需查看可重新搜索本书。</div>';

  // 恢复对话区
  const area = document.getElementById('resultArea');
  const content = document.getElementById('resultContent');
  area.classList.remove('hidden');
  document.getElementById('selectedPassage').classList.remove('hidden');
  document.getElementById('passageText').textContent = state.selectedText;

  content.innerHTML = `
    <div class="qa-container">
      <div class="qa-header">💬 引导式对话 · 第 <span id="roundNum">${Math.min(state.questionRound + 1, 5)}</span>/5 轮</div>
      <div class="qa-messages" id="qaMessages"></div>
      <div class="qa-input-row">
        <textarea id="qaInput" placeholder="输入你的回答…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAnswer()}"></textarea>
        <button class="send-btn" id="qaSendBtn" onclick="sendAnswer()">➤</button>
      </div>
    </div>
  `;

  const messages = document.getElementById('qaMessages');
  const history = state.conversationHistory.filter(m => m.role !== 'system');
  history.forEach((m, i) => {
    const isAi = m.role === 'assistant';
    const div = document.createElement('div');
    div.className = 'message ' + (isAi ? 'ai' : 'user');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.content;
    div.appendChild(bubble);
    messages.appendChild(div);
  });

  if (state.questionRound >= 5) {
    finishChat(messages);
  } else {
    document.getElementById('roundNum').textContent = state.questionRound + 1;
    document.getElementById('qaInput').disabled = false;
    document.getElementById('qaSendBtn').disabled = false;
  }
  saveSession();
  if (window._pendingSession) { window._pendingSession = null; }
}

async function startBookMindmap() {

  const content = document.getElementById('mindmapContent');

  if (!book) {
    content.innerHTML = '<div class="status-msg warning">请先搜索一本书。</div>';
    return;
  }
  if (!state.apiKey) {
    content.innerHTML = '<div class="status-msg warning">⚠️ 还没有配置 API Key，请先点击右上角「⚙️ 设置」配置智谱或 DeepSeek 的 Key。</div>';
    toggleSettings();
    return;
  }

  content.innerHTML = '<div class="loading-row" id="mindmapLoading"><div class="loading-dots"><span></span><span></span><span></span></div><span id="mindmapLoadingText">正在为《' + escapeHtml(book.title) + '》生成全书结构图…</span></div>';

  try {
    let context = '';
    if (book.intro) {
      context += '【书籍简介】\n' + String(book.intro).slice(0, 1500) + '\n\n';
    }
    if (book.chapters && book.chapters.length) {
      context += '【章节目录】\n';
      book.chapters.forEach(c => {
        context += '  '.repeat((c.level || 1) - 1) + c.title + '\n';
      });
    }
    if (!context.trim()) {
      throw new Error('书籍简介与章节目录均为空，无法生成结构导图');
    }

    const fullResp = await callLLMStream([
      { role: 'system', content: BOOK_MINDMAP_SYSTEM + '\n\n' + BOOK_MINDMAP_EXAMPLE },
      { role: 'user', content: `请为以下书籍生成可视化图表：\n书名：《${book.title}》\n作者：${book.author}\n\n${context}\n\n请基于以上信息判断书籍类型（虚构/非虚构），选择合适的图表类型（mindmap 结构导图 或 graph 人物关系图/情节图），生成一个丰富、具体、有深度的可视化图表。不要泛泛而谈，要体现这本书的独特性。` },
    ], 0.3, {
      onDelta: (delta) => {
        const t = document.getElementById('mindmapLoadingText');
        if (t) t.textContent = '正在生成全书结构图…（' + delta.length + ' 字）';
      }
    });

    const mermaidMatch = fullResp.match(/```mermaid\n?([\s\S]*?)```/) || fullResp.match(/mindmap[\s\S]*/);
    const mermaidCode = mermaidMatch ? (mermaidMatch[1] || mermaidMatch[0]).trim() : fullResp.trim();

    state.lastMermaidCode = mermaidCode;
    state.mindmapBookTitle = book.title;

    renderMindmapPreview(mermaidCode, book.title);
  } catch(e) {
    content.innerHTML = '<div class="status-msg error">导图生成失败：' + escapeHtml(e.message) + '</div><div style="margin-top:10px"><button class="btn btn-outline" onclick="startBookMindmap()">🔄 重试生成</button></div>';
  }
}

function initMermaidElement(id, fallbackCode) {
  try {
    mermaid.init(undefined, document.getElementById(id));
    const el = document.getElementById(id);
    const svg = el && el.querySelector('svg');
    if (svg) {
      svg.style.maxWidth = 'none';
      svg.style.height = 'auto';
      const vb = svg.getAttribute('viewBox');
      if (vb) {
        const parts = vb.split(' ').map(Number);
        if (parts[3] && parts[3] < 300) {
          const scale = 400 / parts[3];
          svg.setAttribute('viewBox', `${parts[0]} ${parts[1]} ${parts[2]} ${parts[3] * scale}`);
        }
      }
    }
  } catch(e) {
    document.getElementById(id).innerHTML = '<pre style="font-size:12px;color:var(--text-muted)">' + escapeHtml(fallbackCode) + '</pre>';
  }
}

function toggleMindmapMode(mode) {

function downloadMermaidPng() {
  // Try multiple selectors to find the SVG
  let svg = document.querySelector('#mindmapViewArea svg');
  if (!svg) {
    const wrapper = document.querySelector('#mindmapViewArea .mermaid');
    svg = wrapper && wrapper.querySelector('svg');
  }
  if (!svg) {
    const allSvgs = document.querySelectorAll('.mindmap-result svg, .mermaid svg');
    svg = allSvgs[allSvgs.length - 1]; // Get the last one (most recently rendered)
  }
  if (!svg) { showToast('没有可导出的图表，请稍等渲染完成后再试'); return; }

  showToast('正在生成 PNG…');

  try {
    // Get SVG dimensions
    const rect = svg.getBoundingClientRect();
    const svgWidth = rect.width || parseInt(svg.getAttribute('width')) || 800;
    const svgHeight = rect.height || parseInt(svg.getAttribute('height')) || 600;

    // Clone and prepare SVG for export
    const svgClone = svg.cloneNode(true);

    // Ensure SVG has proper xmlns and dimensions
    if (!svgClone.getAttribute('xmlns')) svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    if (!svgClone.getAttribute('width')) svgClone.setAttribute('width', svgWidth);
    if (!svgClone.getAttribute('height')) svgClone.setAttribute('height', svgHeight);

    // Inline styles for better compatibility
    const svgData = new XMLSerializer().serializeToString(svgClone);
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    let done = false;

    img.onload = function() {
      if (done) return;
      done = true;

      const canvas = document.createElement('canvas');
      const scale = 2; // High-res
      const cw = Math.max(img.width || svgWidth, 400);
      const ch = Math.max(img.height || svgHeight, 300);
      canvas.width = cw * scale;
      canvas.height = ch * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);

      canvas.toBlob(function(blob) {
        if (!blob) {
          showToast('导出失败：Canvas 生成失败');
          URL.revokeObjectURL(url);
          return;
        }
        const dlUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const title = (state.mindmapBookTitle || 'mindmap').replace(/[<>:"/\\|?*]/g, '_');
        a.href = dlUrl;
        a.download = title + '-导图.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(dlUrl);
        URL.revokeObjectURL(url);
        showToast('✅ PNG 已导出到下载文件夹');
      }, 'image/png');
    };

    img.onerror = function() {
      if (done) return;
      done = true;
      URL.revokeObjectURL(url);
      showToast('导出失败：SVG 渲染出错。建议复制代码到 mermaid.live 导出');
    };

    // Timeout fallback
    setTimeout(function() {
      if (!done) {
        done = true;
        URL.revokeObjectURL(url);
        showToast('导出超时。建议复制代码到 mermaid.live 导出');
      }
    }, 10000);

    img.src = url;
  } catch(e) {
    showToast('导出失败：' + e.message);
  }
}

// 流式生成 AI 的下一轮提问/回复
async function streamAIRound() {
  const messages = document.getElementById('qaMessages');
  const input = document.getElementById('qaInput');
  const sendBtn = document.getElementById('qaSendBtn');
  state.isProcessing = true;
  input.disabled = true;
  sendBtn.disabled = true;

  // 创建空气泡，流式填充
  const aiMsg = document.createElement('div');
  aiMsg.className = 'message ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="loading-dots" style="display:inline-flex"><span></span><span></span><span></span></div> 思考中…';
  aiMsg.appendChild(bubble);
  messages.appendChild(aiMsg);
  messages.scrollTop = messages.scrollHeight;

  try {
    let full = '';
    const resp = await callLLMStream(state.conversationHistory, 0.8, {
      onDelta: (delta) => {
        full += delta;
        bubble.textContent = full;   // textContent 天然转义
        messages.scrollTop = messages.scrollHeight;
      }
    });

    // 流式可能未触发 onDelta（如纯增量异常），兜底
    if (!full && resp) { bubble.textContent = resp; full = resp; }
    if (!full) throw new Error('模型返回为空');

    state.questionRound++;
    state.conversationHistory.push({ role: 'assistant', content: full });
    state.isProcessing = false;
    saveSession();
    afterAIRound();
  } catch(e) {
    bubble.textContent = '';
    const errDiv = document.createElement('div');
    errDiv.className = 'status-msg error';
    errDiv.textContent = '生成失败：' + e.message;
    aiMsg.appendChild(errDiv);
    state.isProcessing = false;
    input.disabled = false;
    sendBtn.disabled = false;
  }
}

function afterAIRound() {
  const input = document.getElementById('qaInput');
  const sendBtn = document.getElementById('qaSendBtn');
  const roundNum = document.getElementById('roundNum');
  roundNum.textContent = state.questionRound;
  const messages = document.getElementById('qaMessages');

  if (state.questionRound >= 5) {
    input.disabled = true;
    sendBtn.disabled = true;
    input.placeholder = '对话已完成，可导出笔记或生成读书小结';
    finishChat(messages);
  } else {
    roundNum.textContent = state.questionRound + 1;
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
  saveSession();
}

function finishChat(messages) {
  if (!messages) messages = document.getElementById('qaMessages');

  const actions = document.createElement('div');

  exportBtn.className = 'btn btn-outline';

async function genSummary() {
  const book = state.currentBook || {};
  const btn = document.getElementById('btnGenSummary');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '生成中…';

  const messages = document.getElementById('qaMessages');
  const summaryMsg = document.createElement('div');
  summaryMsg.className = 'message ai';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="loading-dots" style="display:inline-flex"><span></span><span></span><span></span></div> 正在整理小结…';
  summaryMsg.appendChild(bubble);
  messages.appendChild(summaryMsg);
  messages.scrollTop = messages.scrollHeight;

  try {
    const chatPart = state.conversationHistory
      .filter(m => m.role !== 'system')
      .map(m => (m.role === 'assistant' ? '教练问：' : '我答：') + m.content)
      .join('\n\n');

    const messagesArr = [
      { role: 'system', content: SUMMARY_SYSTEM },
      { role: 'user', content: `请根据以下这场 5 轮苏格拉底对话，为《${book.title}》（${book.author || '未知作者'}）整理一份结构化读书小结。\n\n【对话记录】\n${chatPart}\n\n请输出读书小结。` },
    ];

    let full = '';
    const resp = await callLLMStream(messagesArr, 0.4, {
      onDelta: (delta) => {
        full += delta;
        bubble.textContent = full;
        messages.scrollTop = messages.scrollHeight;
      }
    });
    if (!full && resp) { bubble.textContent = resp; full = resp; }
    state.chatSummary = full;
    saveSession();
    showToast('读书小结已生成，可随笔记一并导出');
  } catch(e) {
    bubble.textContent = '';
    const errDiv = document.createElement('div');
    errDiv.className = 'status-msg error';
    errDiv.textContent = '小结生成失败：' + e.message;
    summaryMsg.appendChild(errDiv);
  } finally {
    btn.disabled = false;
    btn.textContent = '📝 重新生成读书小结';
  }
}

async function sendAnswer() {
  const input = document.getElementById('qaInput');
  const answer = input.value.trim();
  if (!answer || state.isProcessing || state.questionRound >= 5) return;

  const messages = document.getElementById('qaMessages');

// ============ LLM CALL ============
// 统一的 LLM 调用：默认流式（OpenAI 兼容 SSE）；当响应非流式（降级/异常）时自动改走完整 JSON 读取。
// opts.onDelta(deltaText) 每次收到增量触发；返回完整文本。
async function callLLMStream(messages, temperature = 0.7, opts = {}) {
  const provider = PROVIDERS[state.provider];
  const maxTokens = opts.maxTokens || 4096;
  let resp;
  try {
    resp = await fetch(provider.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.apiKey}` },
      body: JSON.stringify({ model: provider.model, messages, temperature, max_tokens: maxTokens, stream: true }),
    });
  } catch(networkErr) {
    throw new Error('网络请求失败（可能是 CORS 或网络问题）：' + networkErr.message + '。如果你在 Preview 面板里使用，请在 Safari 中打开 http://localhost:3456');
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 错误 ${resp.status}（请检查 API Key 是否正确）`);
  }
  const ctype = resp.headers.get('content-type') || '';
  if (!resp.body || !ctype.includes('text/event-stream')) {
    // 非流式响应（供应商降级或不支持）
    const data = await resp.json();
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (typeof text === 'string' && text.length && opts.onDelta) opts.onDelta(text);
    return text || '';
  }
  // SSE 流式解析
  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (delta) {
          full += delta;
          if (opts.onDelta) opts.onDelta(delta);
        }
      } catch(e) { /* 忽略不完整行 */ }
    }
  }
  return full;
}

MECE 原则（关键！）：
1. 一级分支之间必须**互斥**——"责任跃升"下的内容不能出现在"沟通跃升"里
2. 同一个概念只在一个分支下展开，不要在多个分支重复

独特性检验：

--- 类型 B：人物关系图（graph LR 或 graph TD） ---

// ============ SETTINGS ============
function toggleSettings() {
  document.getElementById('settingsModal').classList.toggle('active');
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('modelProvider').value = state.provider;
  updateProviderUI();
}

function onProviderChange() {
  const p = document.getElementById('modelProvider').value;
  state.provider = p;
  state.apiKey = p === 'zhipu' ? state.apiKeyZhipu : state.apiKeyDeepseek;
  document.getElementById('apiKeyInput').value = state.apiKey;
  updateProviderUI();
}

function updateProviderUI() {
  const p = PROVIDERS[state.provider];
  document.getElementById('apiKeyLabel').textContent = p.name + ' API Key';
  const link = document.getElementById('keyUrlLink');
  if (link) { link.href = p.keyUrl; link.textContent = new URL(p.keyUrl).hostname; }
}

function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showToast('请输入 API Key'); return; }

  if (state.provider === 'zhipu') {
    state.apiKeyZhipu = key;
    localStorage.setItem('ai_key_zhipu', key);
  } else {
    state.apiKeyDeepseek = key;
    localStorage.setItem('ai_key_deepseek', key);
  }
  state.apiKey = key;
  localStorage.setItem('ai_provider', state.provider);
  updateSettingsUI();
  toggleSettings();
  showToast(PROVIDERS[state.provider].name + ' API Key 已保存');
}

function updateSettingsUI() {
  const btn = document.getElementById('settingsBtn');
  if (state.apiKey) {
    btn.classList.add('configured');
    btn.textContent = '✓ ' + PROVIDERS[state.provider].name + ' 已配置';
  } else {
    btn.classList.remove('configured');
    btn.textContent = '⚙️ 设置';
  }
}

// ============ TOAST ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ UTILS ============
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Init Mermaid

  startOnLoad: false,
  theme: 'default',
  securityLevel: 'antiscript',

  flowchart: { useMaxWidth: false, htmlLabels: false }
});
